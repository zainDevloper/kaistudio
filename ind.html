<title>KAI AI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<style>
:root{--c:#00F0FF;--v:#9B5CFF;--p:#FF3D9A;--bg:#05050F;--tx:#fff;--dim:#9aa0c8;--gl:rgba(14,12,40,.55);--gb:rgba(255,255,255,.12);--g:linear-gradient(100deg,#00F0FF,#9B5CFF 45%,#FF3D9A)}
[data-theme=light]{--bg:#eef0ff;--tx:#0a0a22;--dim:#4a4f78;--gl:rgba(255,255,255,.6);--gb:rgba(10,10,40,.12)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:400 16px/1.65 Manrope,sans-serif;overflow-x:hidden}
body.urdu{font-family:'Noto Nastaliq Urdu',Manrope,sans-serif;line-height:2.1}
h1,h2,.logo{font-family:Unbounded,sans-serif;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
section{padding:110px 6vw;max-width:1280px;margin:auto;position:relative}
h2{font-size:clamp(1.5rem,3.6vw,2.6rem);margin-bottom:34px;letter-spacing:-.02em}
:focus-visible{outline:2px solid var(--c);outline-offset:3px}
#cur{position:fixed;top:-18px;left:-18px;width:36px;height:36px;border:1.5px solid var(--c);border-radius:50%;pointer-events:none;z-index:999;mix-blend-mode:screen;transition:width .25s,height .25s,top .25s,left .25s,background .25s}
#cur.big{width:70px;height:70px;top:-35px;left:-35px;background:#00F0FF22}
@media(hover:none){#cur{display:none}}
/* nav island */
nav{position:fixed;top:14px;left:50%;translate:-50% 0;z-index:100;display:flex;align-items:center;gap:26px;padding:10px 12px 10px 24px;border-radius:99px;background:var(--gl);backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--gb);width:min(94vw,860px);justify-content:space-between;transition:.4s}
nav.s{box-shadow:0 10px 40px #0009,0 0 0 1px #00F0FF33}
.logo{font-size:1.25rem;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;text-decoration:none}
.links{display:flex;gap:22px}.links a{color:var(--tx);text-decoration:none;font-size:.92rem;opacity:.75;transition:.25s}.links a:hover{opacity:1;color:var(--c)}
.tools{display:flex;gap:8px}
.pill{padding:7px 15px;border-radius:99px;border:1px solid var(--gb);background:var(--gl);transition:.25s;font-size:.9rem}
.pill:hover{border-color:var(--c)}.pill.on{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 0 22px #9B5CFF77}
#burger{display:none}
/* hero */
#home{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:20px;padding-top:130px}
h1{font-size:clamp(2.1rem,5.4vw,4.6rem);line-height:1.12;min-height:3.4em;letter-spacing:-.03em;background:linear-gradient(100deg,#fff,#00F0FF,#9B5CFF,#FF3D9A,#fff);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gm 7s linear infinite}
[data-theme=light] h1{background-image:linear-gradient(100deg,#0a0a22,#0090a0,#9B5CFF,#FF3D9A,#0a0a22)}
@keyframes gm{to{background-position:300%}}
.sub{color:var(--dim);font-size:1.15rem;max-width:34ch;margin:8px 0 34px}
.btn{padding:15px 32px;border-radius:16px;font-weight:600;position:relative;overflow:hidden;margin:0 10px 10px 0}
.btn.p{background:var(--g);background-size:200%;color:#fff;box-shadow:0 10px 40px #9B5CFF66;transition:background-position .6s,box-shadow .3s}
.btn.p:hover{background-position:100%;box-shadow:0 10px 60px #FF3D9A88}
.btn.g{border:1px solid var(--gb);background:var(--gl);backdrop-filter:blur(10px)}
.btn:disabled{opacity:.6;cursor:wait}
/* KAI character */
#kai{--eye:#00F0FF;--s:8;position:relative;width:min(100%,400px);aspect-ratio:1;margin:auto;perspective:900px}
.rig,.fl{position:absolute;inset:0;transform-style:preserve-3d}
.ring{position:absolute;inset:-6%;border-radius:50%;border:1.5px solid var(--eye);box-shadow:0 0 22px var(--eye);opacity:.5;animation:o1 calc(var(--s)*1s) linear infinite;transition:border-color .5s}
.ring:nth-child(2){inset:-20%;border-style:dashed;--s:15;animation-name:o2}
.ring:nth-child(3){inset:8%;--s:5;animation-name:o3;opacity:.28}
@keyframes o1{from{transform:rotateX(72deg) rotateZ(0)}to{transform:rotateX(72deg) rotateZ(360deg)}}
@keyframes o2{from{transform:rotateY(72deg) rotateZ(0)}to{transform:rotateY(72deg) rotateZ(-360deg)}}
@keyframes o3{from{transform:rotateX(55deg) rotateY(40deg) rotateZ(0)}to{transform:rotateX(55deg) rotateY(40deg) rotateZ(360deg)}}
#kai[data-mood=gen] .ring{animation-duration:calc(var(--s)*.18s)}
#kai svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform:translateZ(60px);filter:drop-shadow(0 0 16px var(--eye))}
.ey,.ant,.ch{fill:var(--eye);transition:fill .5s}.arc{stroke:var(--eye);fill:none;stroke-width:7;stroke-linecap:round;display:none;transition:stroke .5s}
#kai[data-mood=gen]{--eye:#FF3D9A}#kai[data-mood=ok]{--eye:#00FF88}#kai[data-mood=err]{--eye:#FF2E2E}
#kai[data-mood=ok] .ey{display:none}#kai[data-mood=ok] .arc{display:block}
#kai[data-mood=err]{animation:shk .5s}
@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.sp{position:absolute;left:50%;top:48%;width:7px;height:7px;border-radius:50%;background:var(--eye);box-shadow:0 0 12px var(--eye);pointer-events:none}
.bub{position:absolute;top:2%;inset-inline-start:-4%;z-index:5;max-width:210px;padding:10px 16px;border-radius:18px 18px 18px 4px;background:var(--gl);border:1px solid var(--eye);backdrop-filter:blur(10px);font-size:.9rem;box-shadow:0 0 24px #0006}
/* ticker */
.tick{overflow:hidden;white-space:nowrap;padding:18px 0;border-block:1px solid var(--gb);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.tick div{display:inline-block;animation:mq 40s linear infinite}.tick:hover div{animation-play-state:paused}
.tick button{margin:0 26px;color:var(--dim);transition:.25s}.tick button:hover{color:var(--c)}
@keyframes mq{to{transform:translateX(-50%)}}
/* panels */
.card,.panel{background:var(--gl);border:1px solid var(--gb);border-radius:24px;backdrop-filter:blur(16px);position:relative;overflow:hidden}
.card::before,.panel::before{content:"";position:absolute;inset:0;background:radial-gradient(320px circle at var(--x,50%) var(--y,50%),#00F0FF1f,transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover::before,.panel:hover::before{opacity:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{padding:30px}.card h3{margin:14px 0 4px;font-family:Unbounded;font-weight:500;font-size:1.05rem}.card p{color:var(--dim)}
.ico{font-size:2.4rem;display:inline-block;animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px) rotate(8deg)}}
.gen{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{padding:28px}
label{display:block;font-weight:600;margin:18px 0 8px}label:first-child{margin-top:0}
textarea{width:100%;height:210px;resize:vertical;padding:18px;border-radius:16px;background:#0000002e;color:var(--tx);border:1px solid var(--gb);font:inherit;transition:.3s}
textarea:focus{outline:0;border-color:var(--c);box-shadow:0 0 30px #00F0FF44}
.cnt{text-align:end;color:var(--dim);font-size:.85rem}.row{display:flex;flex-wrap:wrap;gap:8px}
input[type=range]{width:100%;accent-color:#9B5CFF}.act{margin:18px 0}.act .pill{flex:1;white-space:nowrap}#go{width:100%;margin:0;font-size:1.05rem}
.stage{min-height:460px;display:grid;place-items:center;text-align:center}
.st{display:none;flex-direction:column;align-items:center;gap:16px;width:100%}
#stage[data-s=idle] #s-idle,#stage[data-s=load] #s-load,#stage[data-s=ok] #s-ok,#stage[data-s=err] #s-err{display:flex}
#stage[data-s=err]{border-color:#FF2E2E;box-shadow:0 0 40px #FF2E2E55}
.ghost{width:150px;height:150px;border:2px dashed var(--dim);border-radius:22px;display:grid;place-items:center;font-size:3rem;animation:fl 4s ease-in-out infinite;position:relative;overflow:hidden}
.ghost::after{content:"";position:absolute;inset-inline:0;height:3px;background:var(--c);box-shadow:0 0 14px var(--c);animation:scan 2.4s ease-in-out infinite alternate}@keyframes scan{from{top:0}to{top:100%}}
.pw{position:relative;width:170px;height:170px}.pw svg{transform:rotate(-90deg);width:100%}.pw circle{fill:none;stroke-width:6}
.pw .t{stroke:var(--gb)}#ring{stroke:url(#gr);stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;filter:drop-shadow(0 0 6px var(--c))}
#pct{position:absolute;inset:0;display:grid;place-items:center;font:800 1.5rem Unbounded}
.imgw{position:relative;max-width:100%;border-radius:16px;overflow:hidden;line-height:0}
#out{max-width:100%;max-height:480px}#rv{position:absolute;inset:0;width:100%;height:100%;display:none}
.imgw::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#00F0FF2a 45%,#FF3D9A2a 55%,transparent 65%);background-size:250%;animation:gm 4s linear infinite;pointer-events:none}
#gal{columns:4 210px;column-gap:14px}#gal figure{break-inside:avoid;margin-bottom:14px;position:relative;border-radius:16px;overflow:hidden;cursor:pointer;transition:.35s}
#gal figure:hover{transform:scale(1.04) rotate(-.6deg);box-shadow:0 0 40px #9B5CFF99;z-index:2}#gal img{width:100%;display:block}
#gal span{position:absolute;inset:0;display:grid;place-items:center;background:#0008;opacity:0;transition:.3s;color:#fff}#gal figure:hover span{opacity:1}
.empty{color:var(--dim)}.gh{display:flex;justify-content:space-between;align-items:center}
#lb{position:fixed;inset:0;z-index:200;background:rgba(3,3,12,.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}#lb.open{display:flex}
#lb img{max-width:92vw;max-height:76vh;border-radius:18px;box-shadow:0 0 70px #9B5CFF66}#lbx{position:absolute;top:18px;inset-inline-end:26px;font-size:2rem;color:#fff}
footer{text-align:center;padding:70px 6vw 40px;color:var(--dim);border-top:1px solid var(--gb)}footer .logo{font-size:2.4rem}
.fl2{display:flex;gap:24px;justify-content:center;margin:18px 0}footer a{color:var(--dim);text-decoration:none}footer a:hover{color:var(--c)}
#toasts{position:fixed;bottom:24px;inset-inline-end:24px;z-index:300;display:flex;flex-direction:column;gap:10px}
/* ===== creator card ===== */
.creator{
  display:inline-flex;
  align-items:center;
  gap:20px;
  padding:22px 32px;
  margin:26px auto 20px;
  border-radius:24px;
  background:var(--gl);
  backdrop-filter:blur(16px);
  border:1px solid var(--gb);
  text-align:left;
  position:relative;
  overflow:hidden;
  transition:.4s;
  max-width:520px;
}
.creator::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(400px circle at 0% 50%,#00F0FF22,transparent 60%);
  pointer-events:none;
}
.creator:hover{
  border-color:var(--c);
  box-shadow:0 0 40px #00F0FF44;
  transform:translateY(-4px);
}
.creator-badge{
  font-size:2.2rem;
  width:64px;
  height:64px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--g);
  box-shadow:0 0 30px #9B5CFF66;
  flex-shrink:0;
  animation:fl 4s ease-in-out infinite;
}
.creator-info h3{
  font-family:Unbounded;
  font-weight:800;
  font-size:1.15rem;
  margin:0 0 4px;
  background:var(--g);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.creator-info .role{
  color:var(--dim);
  font-size:.88rem;
  margin:0 0 6px;
  letter-spacing:.01em;
}
.creator-info .loc{
  color:var(--tx);
  font-size:.9rem;
  margin:0 0 8px;
  opacity:.85;
}
.creator-info .mail{
  color:var(--c);
  text-decoration:none;
  font-size:.92rem;
  font-weight:600;
  border-bottom:1px dashed transparent;
  transition:.25s;
}
.creator-info .mail:hover{
  border-bottom-color:var(--c);
  text-shadow:0 0 12px var(--c);
}

/* Urdu mode adjustments */
body.urdu .creator-info h3{
  font-family:'Noto Nastaliq Urdu',Unbounded,sans-serif;
  font-size:1.25rem;
}
body.urdu .creator-info .mail{
  direction:ltr;
  display:inline-block;
}

@media(max-width:520px){
  .creator{flex-direction:column;text-align:center;padding:24px 20px}
  .creator-info{text-align:center}
}
.toast{padding:13px 20px;border-radius:14px;background:var(--gl);backdrop-filter:blur(14px);border:1px solid var(--c);box-shadow:0 0 26px #00F0FF44}.toast.err{border-color:#FF2E2E;box-shadow:0 0 26px #FF2E2E55}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.gen{grid-template-columns:1fr}#home{grid-template-columns:1fr;text-align:center}.sub{margin-inline:auto}#kai{width:min(78vw,320px)}}
@media(max-width:768px){#burger{display:block}.links{position:absolute;top:66px;inset-inline:0;flex-direction:column;align-items:center;background:var(--gl);backdrop-filter:blur(18px);border:1px solid var(--gb);border-radius:24px;padding:22px;transform:scale(.9);opacity:0;pointer-events:none;transition:.3s}.links.open{transform:none;opacity:1;pointer-events:auto}.grid{grid-template-columns:1fr}section{padding:80px 5vw}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

const ta=$("#prompt");

/* ===== text scramble (hero headline decodes itself) ===== */
function scramble(el,txt){
 if(lang==="ur"){el.textContent=txt;gsap.from(el,{opacity:0,y:30,duration:1});return}
 const ch="!<>-_/[]{}=+*^?#",o={p:0};
 gsap.to(o,{p:1,duration:1.8,ease:"none",onUpdate:()=>el.textContent=[...txt].map((c,i)=>c===" "||i<o.p*txt.length?c:ch[Math.random()*ch.length|0]).join("")});
}
/* ===== character speech bubble ===== */
function say(txt){const b=$("#bub");b.textContent=txt;gsap.fromTo(b,{scale:.6,opacity:0,transformOrigin:"0% 100%"},{scale:1,opacity:1,duration:.4,ease:"back.out(2.5)"})}
/* ===== character mood: idle | gen | ok | err ===== */
function mood(m){
 $("#kai").dataset.mood=m;G=m==="gen"?1:0;clearInterval(sparkT);clearTimeout(moodT);
 gsap.to("#hl,#hr",{attr:{cy:m==="ok"?168:232},duration:.6,ease:"back.out(2.5)"});
 if(m==="gen")sparkT=setInterval(spark,90);
 if(m==="ok"||m==="err")moodT=setTimeout(()=>{mood("idle");say(t("greeting"))},3500);
}
function spark(){const k=$("#kai"),d=document.createElement("i"),a=Math.random()*6.28,r=130+Math.random()*100;d.className="sp";k.append(d);
 gsap.fromTo(d,{x:0,y:0,opacity:1,scale:1.4},{x:Math.cos(a)*r,y:Math.sin(a)*r,opacity:0,scale:0,duration:1.1,ease:"power2.out",onComplete:()=>d.remove()})}

/* ===== generation ===== */

async function generate(){
 if(busy)return;const prompt=ta.value.trim();
 if(!prompt){toast(t("toast_empty"),"err");gsap.fromTo(ta,{x:-8},{x:0,duration:.5,ease:"elastic.out(1,.3)"});return}

 let p=0,i=0;$("#status").textContent=t("st")[0];say(t("st")[0]);
 const tick=setInterval(()=>{p+=(92-p)*.04;$("#ring").style.strokeDashoffset=327*(1-p/100);$("#pct").textContent=Math.round(p)+"%"},100);
 const cyc=setInterval(()=>{i=(i+1)%4;$("#status").textContent=t("st")[i];say(t("st")[i])},1500);
 try{
  const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},signal:ctrl.signal,body:JSON.stringify({prompt,style:sel.style,aspect:sel.aspect,steps:+$("#steps").value})});
  const d=await r.json();if(!d.success)throw new Error(d.error||"Failed");
  last=d;$("#ring").style.strokeDashoffset=0;$("#pct").textContent="100%";
  await showImage(d.image_url);mood("ok");say(t("toast_ready"));toast(t("toast_ready"));speak(t("speak_ready"));refreshGallery();
 }catch(e){
  if(e.name==="AbortError"){mood("idle");setState("idle");return}
  $("#errmsg").textContent=e.message;setState("err");mood("err");say(t("toast_error"));speak(t("speak_err"));toast(t("toast_error"),"err");
 }finally{clearInterval(tick);clearInterval(cyc);busy=false;$("#go").disabled=false}
}
/* image "resolves" from giant pixels into full detail */
function showImage(url){return new Promise(res=>{const im=$("#out");im.onload=()=>{setState("ok");pixelResolve(im);res()};im.onerror=()=>res();im.src=url})}
function pixelResolve(im){
 const cv=$("#rv"),w=im.naturalWidth,h=im.naturalHeight,x=cv.getContext("2d"),o=document.createElement("canvas"),ox=o.getContext("2d"),k={v:0};
 cv.width=w;cv.height=h;cv.style.display="block";im.style.visibility="hidden";
 gsap.to(k,{v:1,duration:1.6,ease:"power2.out",onUpdate:()=>{const s=Math.max(1,Math.round(Math.pow(1-k.v,2)*70));o.width=Math.ceil(w/s);o.height=Math.ceil(h/s);ox.drawImage(im,0,0,o.width,o.height);x.imageSmoothingEnabled=false;x.drawImage(o,0,0,o.width,o.height,0,0,w,h)},
  onComplete:()=>{cv.style.display="none";im.style.visibility=""}});
}

 navigator.clipboard.writeText(location.origin+u);toast("🔗 "+location.origin+u)}

/* ===== WebGL: domain-warped aurora shader that reacts to the mouse and to "generating" ===== */
const FS=`precision highp float;uniform float t,g,lt;uniform vec2 r,m;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.545);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fb(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*n(p);p=p*2.02+7.;a*=.5;}return s;}
void main(){vec2 p=(gl_FragCoord.xy-.5*r)/r.y;vec2 mm=(m-.5)*vec2(r.x/r.y,1.);float tt=t*.1*(1.+g*3.);
 vec2 q=vec2(fb(p*1.6+tt),fb(p*1.6+vec2(5.2,1.3)-tt));vec2 w=vec2(fb(p*1.6+3.*q+vec2(1.7,9.2)+tt*1.3),fb(p*1.6+3.*q+vec2(8.3,2.8)-tt));
 float f=fb(p*1.6+3.*w);float d=length(p-mm);f+=.4*exp(-d*3.2)*(1.+g);
 vec3 c=mix(vec3(.02,.02,.07),vec3(.5,.2,1.),smoothstep(.2,.8,q.x));c=mix(c,vec3(0.,.9,1.),smoothstep(.35,1.,w.y)*.85);
 c=mix(c,mix(vec3(1.,.24,.6),vec3(1.,.1,.25),g*.5),smoothstep(.55,1.,f)*(.55+g*.6));
 c*=.2+f*.75;c*=1.-.55*length(gl_FragCoord.xy/r-.5);
 gl_FragColor=vec4(mix(c,vec3(.95,.96,1.)-c*.42,lt),1.);}`;
function initScene(){
 let R,U,mx=.5,my=.5,sm=[.5,.5],gg=0,cx=0,cy=0,tx=0,ty=0,rx=0,ry=0;const cur=$("#cur"),kai=$("#kai"),rig=$("#rig");
 if(window.THREE){const mob=innerWidth<768;R=new THREE.WebGLRenderer({canvas:$("#fx"),antialias:false});R.setPixelRatio(mob?.4:.6);
  U={t:{value:0},g:{value:0},lt:{value:0},r:{value:new THREE.Vector2()},m:{value:new THREE.Vector2(.5,.5)}};
  const S=new THREE.Scene();S.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({uniforms:U,vertexShader:"void main(){gl_Position=vec4(position.xy,0.,1.);}",fragmentShader:FS})));
  const cam=new THREE.Camera(),size=()=>{R.setSize(innerWidth,innerHeight,false);U.r.value.set(R.domElement.width,R.domElement.height)};size();addEventListener("resize",size);R.S=S;R.cam=cam}

 gsap.to("#hl",{y:-6,yoyo:true,repeat:-1,duration:1.8,ease:"sine.inOut"});
 (function blink(){gsap.to("#eyes",{scaleY:.08,svgOrigin:"120 112",duration:.07,yoyo:true,repeat:1,onComplete:()=>setTimeout(blink,1800+Math.random()*3500)})})();
 const t0=performance.now();
 (function loop(){requestAnimationFrame(loop);
  cx+=(tx-cx)*.18;cy+=(ty-cy)*.18;cur.style.transform=`translate(${cx}px,${cy}px)`;
  // character: whole body tilts in 3D toward the cursor, pupils slide further
  const b=kai.getBoundingClientRect(),dx=(tx-(b.left+b.width/2))/innerWidth,dy=(ty-(b.top+b.height/2))/innerHeight;
  rx+=(-dy*30-rx)*.08;ry+=(dx*40-ry)*.08;rig.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;
  $("#ey").setAttribute("transform",`translate(${Math.max(-12,Math.min(12,dx*40))} ${Math.max(-8,Math.min(8,dy*30))})`);
  if(!R)return;U.t.value=(performance.now()-t0)/1000;gg+=(G-gg)*.04;U.g.value=gg;LT+=((theme==="light"?1:0)-LT)*.08;U.lt.value=LT;
  sm[0]+=(mx-sm[0])*.06;sm[1]+=(my-sm[1])*.06;U.m.value.set(sm[0],sm[1]);R.render(R.S,R.cam)})();
}

/* ===== init ===== */
function init(){

 $("#tick").innerHTML=[...P,...P].map(p=>`<button>✦ ${p}</button>`).join("");$("#tick").onclick=e=>{if(e.target.tagName==="BUTTON"){ta.value=e.target.textContent.slice(2);onInput();$("#generate").scrollIntoView({behavior:"smooth"})}};

}
